;
; Based on sparse/usr/share/csd/settings.d/10-hw-settings.ini of
; mer-hybris/droid-config-sony-murray at 83c7d48dfee5a0fa320b30c2e494c4489bd3002a
; (Jolla; droid-config packages are tagged GPLv2), values for pdx246.
;
; CSD (hardware test tool) features of the Sony Xperia 10 VI (pdx246).
; Hardware from Sony's specification and the LineageOS port's HAL and module
; lists; entries marked TODO need a check on the phone.

[features]
AudioMic1=1
; TODO(device): second microphone
AudioMic2=1
BackCamera=1
BackCameraFlash=1
Backlight=1
Battery=1
Bluetooth=1
BluetoothTethering=1
Cellular5G=1
CellularData=1
CellularVoice=1
CellInfo=1
ECompass=1
; The FM receiver (rtc6226) is not supported under Sailfish OS yet.
FmRadio=0
FrontCamera=1
FrontCameraFlash=0
GPS=1
GSensor=1
Gyro=1
Hall=0
Fingerprint=1
Headset=1
Key=1
LCD=1
; TODO(device): notification LED (leds-aw2016 / leds-qti-tri-led, sysfs red/green/blue)
LED=1
LightSensor=1
Loudspeaker=1
TOH=0
ProxSensor=1
Receiver=1
SDCard=1
SIM=1
; TODO(device): earpiece as second speaker
StereoLoudspeaker=1
Touch=1
TouchAuto=0
UsbCharging=1
UsbOtg=1
Vibrator=1
Wifi=1

[BackCamera]
Flash=1

[LED]
; Supported types are: Binary, White, AmberGreen, RedGreen, and RGB
LedType=RGB

[SIM]
; dsds: two IRadio slots. TODO(device): is slot 2 a physical SIM on both
; XQ-ES54 and XQ-ES72, or eSIM only (which Sailfish OS cannot use)?
ModemCount=2

[Battery]
VoltageTest=False
