;
; Based on sparse/usr/share/csd/settings.d/10-hw-settings.ini of
; mer-hybris/droid-config-sony-murray at 83c7d48dfee5a0fa320b30c2e494c4489bd3002a
; (Jolla; droid-config packages are tagged GPLv2), values for pdx246.
;
; Hardware features of the Sony Xperia 10 VI (pdx246), read by CSD (the hardware
; test tool) and, through libssusysinfo, by Settings, sensorfw and usb-moded.
; Hardware from Sony's specification and the LineageOS port's HAL and module
; lists; entries marked TODO need a check on the phone.

[features]
AudioMic1=1
AudioMic2=1
BackCamera=1
BackCameraFlash=1
Backlight=1
Battery=1
Bluetooth=1
BluetoothTethering=1
Cellular5G=1
CellularData=1
CellularVoice=1
CellInfo=1
ECompass=1
; The FM receiver (rtc6226) is not supported under Sailfish OS yet.
FmRadio=0
FrontCamera=1
FrontCameraFlash=0
GPS=1
GSensor=1
Gyro=1
Hall=0
Fingerprint=1
Headset=1
Key=1
LCD=1
; No notification LED: the kernel's red, green and blue LED nodes drive nothing.
LED=0
LightSensor=1
Loudspeaker=1
TOH=0
ProxSensor=1
Receiver=1
SDCard=1
SIM=1
; TODO(device): earpiece as second speaker
StereoLoudspeaker=1
Touch=1
TouchAuto=0
UsbCharging=1
UsbOtg=1
Vibrator=1
Wifi=1

[BackCamera]
Flash=1

[SIM]
; dsds: two IRadio slots (on the XQ-ES54 a SIM card and the eSIM; an eSIM
; profile set up under Android works).
ModemCount=2

[Battery]
VoltageTest=False
