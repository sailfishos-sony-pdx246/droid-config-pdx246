#
# Waydroid on pdx246: the download channel with the Android images the port is
# tested with (github.com/sailfishos-sony-pdx246/waydroid-ota). waydroid init
# downloads them, checks their SHA-256 and unpacks them below /var/lib/waydroid;
# waydroid upgrade installs a newer tested image once the channel names one.
# Waydroid's own channel has no vendor image under the type it derives for this
# phone (HALIUM_16).
[channels]
system_channel = https://sailfishos-sony-pdx246.github.io/waydroid-ota/system
vendor_channel = https://sailfishos-sony-pdx246.github.io/waydroid-ota/vendor
rom_type = lineage
system_type = VANILLA
