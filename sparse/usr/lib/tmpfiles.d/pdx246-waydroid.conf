# Waydroid on pdx246.
# The container's binder nodes: kernel CONFIG_ANDROID_BINDER_DEVICES creates them in
# the binderfs that Android's init mounts at /dev/binderfs; waydroid looks for them
# in /dev. Without them it would pick the phone's own nodes or mount a second
# binderfs over /dev/binderfs.
L /dev/puddlejumper - - - - /dev/binderfs/puddlejumper
L /dev/vndpuddlejumper - - - - /dev/binderfs/vndpuddlejumper
L /dev/hwpuddlejumper - - - - /dev/binderfs/hwpuddlejumper
# Pre-installed Waydroid images live on /home (the root filesystem is small);
# the package's %post creates /home/waydroid-extra/images.
L /etc/waydroid-extra - - - - /home/waydroid-extra
