#
# Call audio: module-droid-hidl starts audiosystem-passthrough as type "qti"
# only if it finds IQcRilAudio in /vendor/etc/vintf/manifest.xml or
# /vendor/manifest.xml (pulseaudio-modules-droid-hidl module-droid-hidl.c).
# pdx246 declares vendor.qti.hardware.radio.am IQcRilAudio (registered by
# qcrild, slot1/slot2) only in the per-SKU manifests (/odm/etc/vintf/manifest_ds.xml,
# manifest_ss.xml), so it would fall back to "af" and qcrild could not pass the
# call parameters to the audio HAL. The module sets the variable without
# overwriting, so this value wins.
[Service]
Environment=AUDIOSYSTEM_PASSTHROUGH_TYPE=qti
