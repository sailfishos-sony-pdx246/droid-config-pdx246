#
# mce writes its charging decision to /run/pdx246-charging-control
# (70-battery-pdx246.ini), which pdx246-charging-control.service copies to
# Sony's SmartCharge node. mce checks the path once at startup (access W_OK)
# and later opens it O_WRONLY without O_CREAT, so the file has to exist
# before mce starts. tmpfiles.d is not early enough: mce has no default
# dependencies and is not ordered after systemd-tmpfiles-setup.service.
# The file is created only if missing (a restarted mce writes its own value
# at once). No waiting, and "-": this must never hold up or fail mce, which
# the user session waits for (NOTES D14).
[Unit]
Wants=pdx246-charging-control.path pdx246-charging-control.timer

[Service]
ExecStartPre=-/bin/sh -c '[ -e /run/pdx246-charging-control ] || printf 0 > /run/pdx246-charging-control'
