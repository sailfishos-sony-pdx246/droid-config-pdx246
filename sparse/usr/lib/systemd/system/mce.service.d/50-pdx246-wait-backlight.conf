#
# mce probes /sys/class/backlight/* once at startup (about 5.3 s on the third
# boot), but panel0-backlight only appears when msm_drm's deferred panel bind
# completes (about 6 s, while droid-hal-init's vendor.modprobe loads the
# vendor_dlkm modules). Without it mce has no brightness control. Wait at most
# 10 s, well inside mce's start timeout.
# Not the charging limiter node (70-battery-pdx246.ini): battchg_ext's device
# only appears once the ADSP runs (pmic_glink; ADSP boot comes from
# droid-hal-init's early-boot, ~17 s on the sixth boot), and the user session
# waits for mce, so waiting for it delayed the UI by 10 s (NOTES D14).
[Service]
ExecStartPre=/bin/sh -c 'for n in $$(seq 10); do [ -e /sys/class/backlight/panel0-backlight/brightness ] && exit 0; sleep 1; done; exit 0'
