#
# Lock VT switching before mce starts (pdx246-vt-lockswitch.service, NOTES D27):
# otherwise every suspend attempt switches consoles and mce's bluetooth module
# holds mce_bluez_wait for 2 s after each resume. A failure of that unit does
# not affect mce (Wants=, not Requires=).
[Unit]
Wants=pdx246-vt-lockswitch.service
