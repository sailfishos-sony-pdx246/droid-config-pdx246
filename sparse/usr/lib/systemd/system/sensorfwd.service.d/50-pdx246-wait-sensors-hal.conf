#
# sensorfw's binder backend gives up after 5 s without a sensors HAL, and
# systemd stops restarting it after 3 tries. The vendor multihal starts with
# droid-hal-init's "on boot" (class hal) and needs the ADSP sensor domain, so
# it can come later than that. Wait for it (at most 45 s; then start anyway).
[Service]
ExecStartPre=/bin/sh -c 'for n in $$(seq 45); do binder-list -d /dev/binder 2>/dev/null | grep -qx android.hardware.sensors.ISensors/default && exit 0; sleep 1; done; echo "sensors HAL not registered after 45 s" >&2; exit 0'
TimeoutStartSec=90
