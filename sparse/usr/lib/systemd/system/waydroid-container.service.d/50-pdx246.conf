#
# pdx246: the container needs the vendor view, and must never start on the
# phone's own binder nodes (check-config).
[Unit]
Requires=pdx246-waydroid-vendor-view.service
After=pdx246-waydroid-vendor-view.service

[Service]
ExecStartPre=/usr/libexec/pdx246-waydroid/check-config
