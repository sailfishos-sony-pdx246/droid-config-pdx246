#
# With [udev] extcon_tracking = 0 (99-usb-moded-pdx246.ini), usb-moded exits at
# startup ("no charger device found, bailing out") while the charger's "usb"
# power supply is missing, i.e. while the ADSP (pmic_glink) is not up yet.
# usb-moded-configfs-setup.service waits for it, but only for a limited time.
# Restart=always alone would hit the start limit (DefaultStartLimitBurst=3,
# DefaultRestartSec=1s in /etc/systemd/system.conf) and leave usb-moded failed
# for the rest of the boot, so keep retrying every 5 s until the supply exists.
# (systemd 238: StartLimitIntervalSec belongs in [Unit].)
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=5
