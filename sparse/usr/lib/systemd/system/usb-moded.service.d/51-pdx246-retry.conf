#
# usb-moded picks its charger device once at startup, so it must not start
# while the charger's "usb" power supply is missing (the ADSP, pmic_glink, is
# not up yet). With [udev] android_tracking = 1 (99-usb-moded-pdx246.ini) it
# no longer exits without one ("no charger device found, using alternative
# sources") but takes change events from every power supply, and the
# battery's PRESENT=1 with android_usb DISCONNECTED reads as a charger with no
# cable in. The ExecStartPre check fails the start until the supply exists;
# Restart=always (usb-moded.service) restarts after such a failure too.
# usb-moded-configfs-setup.service waits for the supply, but only for a
# limited time. Restart=always alone would hit the start limit
# (DefaultStartLimitBurst=3, DefaultRestartSec=1s in /etc/systemd/system.conf)
# and leave usb-moded failed for the rest of the boot, so keep retrying every
# 5 s until the supply exists. (systemd 238: StartLimitIntervalSec belongs in
# [Unit].)
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/bin/test -e /sys/class/power_supply/usb
RestartSec=5
