#
# The emergency-call PulseAudio (system-wide, runs before the security code
# when /home is encrypted) gets 120 s to report ready, and the unlock keypad
# waits for it (sailfish-unlock-agent is ordered after emergency-call.target).
# At boot it races the vendor audio stack: if Qualcomm's AGM service is not
# ready when PulseAudio writes its first buffer, AGM crashes
# (session_obj_get_from_pool), the audio HAL aborts with it, and PulseAudio's
# HAL client waits forever. It then took 120 s plus the 15 s stop timeout
# until the keypad appeared (142 s, one boot of two, 2026-11-01). A normal
# start takes about 6 s (waiting for the audio HAL). With these limits the
# keypad comes after about 40 s in that case; systemd restarts PulseAudio
# (Restart=always), and the restarted HAL and AGM work.
[Service]
TimeoutStartSec=30
TimeoutStopSec=5
