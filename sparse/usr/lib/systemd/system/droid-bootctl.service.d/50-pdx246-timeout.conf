#
# droid-bootctl.service (droid-hal-configs sparse-16) is Type=oneshot without a
# start timeout, and bootctl waits for IBootControl without limit, so a boot
# HAL that never registers holds graphical.target (and actdead.target) for
# ever, as on the third boot. Slot marking is done earlier by
# pdx246-mark-slot.service (NOTES.md D22).
[Service]
TimeoutStartSec=120
