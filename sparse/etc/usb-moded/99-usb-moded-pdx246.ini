#
# usb-moded on pdx246: configfs gadget g1 on the DWC3 controller a600000.dwc3
# (androidboot.usbcontroller in pdx246's bootconfig). The gadget directories
# usb-moded does not create itself (g1, strings, configs/b.1) are made by
# usb-moded-configfs-setup.service. Comments go on their own lines: GKeyFile
# keeps an inline "# ..." as part of the value.

[configfs]
# Required: /sys/class/udc also holds dummy_udc.0 (CONFIG_USB_DUMMY_HCD=y) and
# readdir lists it first.
gadget_udc_device     = a600000.dwc3
gadget_conf_directory = configs/b.1
# The kernel has CONFIG_USB_CONFIGFS_RNDIS=y; the default rndis_bam.rndis
# function does not exist in this kernel.
function_rndis        = rndis.usb0
# The default, written out for reference (mtp_mode-droid.ini: sysfs_value = ffs).
function_mtp          = ffs.mtp
# configs/b.1 starts at MaxPower = CONFIG_USB_GADGET_VBUS_DRAW (2 mA), and the
# charger takes MaxPower as its input current limit from a PC: without this the
# phone does not charge from a PC. Android writes 900 (init.qcom.usb.rc); the
# kernel caps it at 500 mA on high speed. usb-moded writes it once at startup
# (configfs_init) and it applies to every mode.
gadget_max_power      = 900

[android]
# usb-moded has no default vendor ID (every mode would enumerate as 0000).
# Keep the 0x: configfs_init writes the text raw, the kernel parses it with
# base 0, and the charging modes never rewrite it ("2931" would be 0x0b73).
# 0x2931 is Jolla's vendor ID. 0x0a02 (developer) and 0x0a07 (MTP) come from
# the mode files; 0x0afe for the charging gadgets (also what a locked phone
# shows) is hard-coded in usb-moded (configfs_set_charging_mode).
idVendor = 0x2931

[network]
# Overrides network_interface = rndis0 in jolla-developer-mode's
# developer_mode-android.ini.
interface = usb0

[udev]
# No usable USB extcon on pdx246: the battery charger's extcon is updated only
# for micro-USB (qti_battery_charger.c:822-824) and the EUD's (the dwc3 glue's
# DT extcon) only while EUD is enabled. Both read USB=0 with a PC attached,
# which usb-moded turns into USB_DCP (a PC counted as a wall charger) whenever
# one of them is the last extcon read or the last to send a change event.
# usb-moded tracks every extcon device by default, so switch it off.
extcon_tracking = 0
# PC or charger: the TYPE of the charger's power supply (default [udev] path
# /sys/class/power_supply/usb) cannot tell. It is USB_PD for a USB-PD wall
# charger and a PD laptop alike, and usb-moded counts USB_PD as a PC (unlock
# prompt, then developer mode on a wall charger). The kernel's android_usb
# device (CONFIG_USB_CONFIGFS_UEVENT) can: USB_STATE turns CONNECTED on a
# host's first control request, CONFIGURED on SET_CONFIGURATION and
# DISCONNECTED on a disconnect or unbind. With tracking on, usb-moded takes
# DISCONNECTED as a charger (type USB_DCP; the supply's ONLINE still says
# whether a cable is in) and any other state as a PC (type USB, online),
# whatever the supply reports. The charging gadget (0afe) stays bound in the
# charger and undefined modes, so a PC still enumerates; it counts as a
# charger for 1-2 s after the plug (usb-moded re-reads 1 s after an
# android_usb event), and an unplug can show up to 1 s late. Defaults used:
# android_path /sys/class/android_usb/android0, android_subsystem
# android_usb. The kernel reports only for the first configfs gadget made
# since boot (android0): keep g1 the only gadget and never remove and
# recreate it. usb-moded must not start without the supply
# (usb-moded.service.d/51-pdx246-retry.conf).
android_tracking = 1
