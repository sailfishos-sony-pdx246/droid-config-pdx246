#
# libncicore (nfcd-binder-plugin) on pdx246: NXP SN-series controller behind
# android.hardware.nfc_snxxx@1.2-service (vendor.nfc_hal_service, nfc_i2c.ko).
# Poll for NFC-A, NFC-B and NFC-F; this is libncicore's default, written out so
# that it is the one place to change. The Xperia 10 V port polls only A and B.
# TODO(runtime): if tag discovery stalls, try "Technologies = A,B".

[Configuration]
Technologies = A,B,F
