#
# libncicore (nfcd-binder-plugin) on pdx246: NXP SN-series controller behind
# android.hardware.nfc_snxxx@1.2-service (vendor.nfc_hal_service, nfc_i2c.ko).
# Poll for NFC-A and NFC-B, as the Xperia 10 IV and 10 V ports do. The
# controller rejects RF discovery (RF_DISCOVER_RSP status 1) with A,B,F (fifth
# boot) and with A,B (sixth boot), so the cause is elsewhere (NOTES D18).

[Configuration]
Technologies = A,B
