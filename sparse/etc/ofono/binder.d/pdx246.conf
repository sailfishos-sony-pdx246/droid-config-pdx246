#
# ofono-binder-plugin on pdx246. The vendor (qcrilNrd, vendor.qcrild and
# vendor.qcrild2) serves android.hardware.radio@1.6::IRadio as slot1 and slot2
# (persist.radio.multisim.config=dsds). The plugin speaks HIDL IRadio up to 1.5,
# which the 1.6 service still implements. The slots themselves come from the
# generic binder.conf (slot1) and binder.d/dual-sim.conf (slot2).

[Settings]
radioInterface = 1.5
# As on the Qualcomm-based Xperia 10 IV/10 V ports: list operators with
# startNetworkScan (IRadio >= 1.2). TODO(runtime): check manual network
# selection; drop this line if the scan returns nothing.
useNetworkScan = true
