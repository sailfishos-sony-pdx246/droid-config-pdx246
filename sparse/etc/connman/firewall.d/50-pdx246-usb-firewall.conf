#
# SSH (tcp/22), usb-moded's DHCP server (udp/67) and ping on usb0, the RNDIS
# interface of usb-moded's developer mode (192.168.2.15). connman's INPUT
# policy is DROP (connman-configs-sailfish firewall.conf), and none of its rules
# covers usb0: "usb" is in NetworkInterfaceBlacklist (main.conf.d/50-pdx246.conf),
# so neither the [wifi]/[ethernet] service rules (jolla-developer-mode
# 00-devmode-firewall.conf) nor the sailfish_developer_mode plugin's accept-all
# reach it. connman accepts -i only in [General] and only literal names
# ("usb+" is rejected, iptables-validate.c handle_interface). The file name must
# end in "firewall.conf"; one key per group, all rules on one line. usb0 has an
# address only in usb-moded's developer mode.
[General]
IPv4.INPUT.RULES = -i usb0 -p tcp -m tcp --dport 22 -j ACCEPT; -i usb0 -p udp -m udp --dport 67 -j ACCEPT; -i usb0 -p icmp -m icmp --icmp-type 8/0 -j ACCEPT
