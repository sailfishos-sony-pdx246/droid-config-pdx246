#
# Interfaces connman must not manage on pdx246. The GKI kernel creates
# Ethernet-type fallback tunnel devices (CONFIG_NET_IPGRE: gretap0, erspan0;
# CONFIG_IPV6_GRE: ip6gretap0) and ifb0/ifb1 (CONFIG_IFB); qcacld creates p2p0;
# the IPA driver creates rndis0 and the rmnet devices, which ofono handles.
# A drop-in replaces the whole key, so the image's list (connman-configs-sailfish
# main.conf: ifb,p2p,usb,rmnet,rev_rmnet; "usb" keeps connman off usb-moded's
# usb0) and connman's built-in defaults (vmnet,vboxnet,virbr,ifb,ve-,vb-) are
# repeated here.
# TODO(runtime): "connmanctl technologies" must not list an ethernet
# technology; "ip link" shows which further names need adding.

[General]
NetworkInterfaceBlacklist = vmnet,vboxnet,virbr,ifb,ve-,vb-,p2p,usb,rmnet,rev_rmnet,gretap,erspan,ip6gretap,rndis
