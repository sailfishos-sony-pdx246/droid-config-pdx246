;
; sensorfw on pdx246. The adaptor plugins are the generic hybris ones
; (droid-configs-device sparse/etc/sensorfw/primaryuse.conf); with
; hybris-libsensorfw-qt5-binder they talk to the vendor's AIDL
; android.hardware.sensors.ISensors/default (multihal, v3) on /dev/binder.
; The binder backend tries AIDL before HIDL by itself, nothing to configure.
;
; Layout follows sensorfw's config/60-sensors-DEVICE.conf.
; TODO(device): compare with the sensor list of the multihal
; ("lshal"/"dumpsys sensorservice" on LineageOS, or sensorfw's journal output)
; and enable stepcountersensor/wakeupsensor if the hardware provides them.

[available]
; The Xperia 10 VI has no barometer.
pressuresensor=False
