#
# Charging limit control (Settings > Battery) through Sony's SmartCharge node,
# the same one the LineageOS port's charging control uses (device/sony/pdx246
# device.mk: lineage_health charging_control_charging_path,
# _charging_enabled 0, _charging_disabled 1). Writing 1 suspends charging,
# writing 0 resumes it.

[Charging]
ControlPath = /sys/class/battchg_ext/smart_charging_interruption
EnableValue = 0
DisableValue = 1
