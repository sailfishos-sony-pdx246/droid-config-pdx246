#
# Charging limit control (Settings > Battery) through Sony's SmartCharge node
# /sys/class/battchg_ext/smart_charging_interruption, the one the LineageOS
# port's charging control uses (device/sony/pdx246 device.mk: lineage_health
# charging_control_charging_path, _charging_enabled 0, _charging_disabled 1).
# Writing 1 suspends charging, writing 0 resumes it.
#
# mce does not write the node itself. It checks ControlPath once at startup
# (modules/charging.c mch_config_init) and runs without charging control if
# the path is not writable, but battchg_ext only appears once the ADSP is up,
# seconds after mce has started. So mce writes its decision to
# /run/pdx246-charging-control (created by
# mce.service.d/51-pdx246-charging-control.conf), and
# pdx246-charging-control.{path,timer,service} copy it to the node
# (/usr/libexec/pdx246-charging-control.sh, NOTES D14).

[Charging]
ControlPath = /run/pdx246-charging-control
EnableValue = 0
DisableValue = 1
