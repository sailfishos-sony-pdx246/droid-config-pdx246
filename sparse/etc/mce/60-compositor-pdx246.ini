#
# Compositor handover (mce's inifiles/compositor.ini): the encryption unlock
# screen draws with DRM/KMS and asks mce to stop Android's composer first;
# Lipstick asks for a freshly started one (dummy_compositor --hwc-restart).
# Jolla's Xperia 10 IV/V configs call /system/bin/stop, /system/bin/start and
# setprop ctl.restart directly; under this port's droid-hal-init a stop or
# restart sends no signal, so the helper ends the process itself.
[Compositor]
StopHwCompositor=/usr/libexec/pdx246-hwc-control.sh stop
StartHwCompositor=/usr/libexec/pdx246-hwc-control.sh start
RestartHwCompositor=/usr/libexec/pdx246-hwc-control.sh restart
