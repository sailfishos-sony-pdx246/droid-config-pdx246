#
# mce-plugin-libhybris is built without libhybris (upstream default: LED code
# only), so the backlight and keypad lookups only log "undefined symbol
# mce_hybris_backlight_init". The backlight comes from sysfs panel0-backlight.
# Sorts after droid-hal-configs' 60-hybris-features.ini.
[FeatureHybris]
BackLight = false
KeyPad = false
