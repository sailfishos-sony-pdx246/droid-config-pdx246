# SPDX-FileCopyrightText: Johannes Meyer zum Alten Borgloh
# SPDX-License-Identifier: GPL-2.0-only

# Copyright and licensing for the files that cannot say it themselves. Files
# whose own header names every holder and licence are not listed (the spec,
# the two patterns, the pack script, every file under sparse/ except the
# symlinks, .gitignore, README.md).
#
# The droid-configs-device/ submodule (mer-hybris/droid-hal-configs, Jolla Ltd.,
# GPLv2 per its droid-configs.inc) is not part of this repository; see
# SUBMODULES.md.
#
# Licences follow the code this builds on: the files written for this port
# are GPL-2.0-only like droid-hal-configs (its packages are tagged GPLv2), the
# documentation (README.md, NOTES.md, SUBMODULES.md) is CC-BY-SA-4.0. Files
# from other owners keep their licence: Jolla's GPL-2.0-only, AOSP's
# Apache-2.0, PulseAudio's LGPL-2.1-or-later.

version = 1
SPDX-PackageName = "droid-config-pdx246"
SPDX-PackageSupplier = "Johannes Meyer zum Alten Borgloh"
SPDX-PackageDownloadLocation = "NOASSERTION"

# The documentation, written for this port.
[[annotations]]
path = ["NOTES.md", "SUBMODULES.md"]
SPDX-FileCopyrightText = "Johannes Meyer zum Alten Borgloh"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Written for this port, in a format whose consumer would read a header as
# data (rpm %files list), and the .gitmodules that "git submodule add"
# creates (SUBMODULES.md).
[[annotations]]
path = ["out-of-image-files.files", ".gitmodules"]
SPDX-FileCopyrightText = "Johannes Meyer zum Alten Borgloh"
SPDX-License-Identifier = "GPL-2.0-only"

# Symlinks: systemd "wants" links and the audio compat link.
[[annotations]]
path = [
    "sparse/usr/lib/systemd/system/local-fs.target.wants/*.mount",
    "sparse/usr/lib/systemd/system/multi-user.target.wants/pdx246-mark-slot.service",
    "sparse/usr/lib/systemd/system/multi-user.target.wants/wifisetup.service",
    "sparse/usr/libexec/droid-hybris/system/lib64/hw/audio.primary.parrot.so",
]
SPDX-FileCopyrightText = "Johannes Meyer zum Alten Borgloh"
SPDX-License-Identifier = "GPL-2.0-only"

# Kickstart fragments that ssu pastes into the .ks file: a comment line would
# become an %attachment entry (mic would look it up as a package). Both follow
# Jolla's files of the same name in mer-hybris/droid-config-sony-zambezi
# (70a3767). Jolla's files carry no notice; the droid-config packages that ship
# them are tagged GPLv2 (droid-hal-configs droid-configs.inc).
#
# part/pdx246 is Jolla's part/xqdc54 unchanged: Jolla only.
[[annotations]]
path = "kickstart/part/pdx246"
SPDX-FileCopyrightText = "Jolla Ltd."
SPDX-License-Identifier = "GPL-2.0-only"

# attachment/pdx246 is Jolla's attachment/xqdc54 with the pdx246 images and
# package.
[[annotations]]
path = "kickstart/attachment/pdx246"
SPDX-FileCopyrightText = ["Jolla Ltd.", "Johannes Meyer zum Alten Borgloh"]
SPDX-License-Identifier = "GPL-2.0-only"

# Android 16's task profiles, copied unchanged from AOSP
# system/core/libprocessgroup/profiles/task_profiles.json (identical to
# /system/etc/task_profiles.json of the LineageOS 23.2 system image). JSON has no
# comments, so the notice is here. A copy, not a link: libprocessgroup reads it
# with android::base::ReadFileToString(), which opens with O_NOFOLLOW.
[[annotations]]
path = "sparse/etc/task_profiles.json"
SPDX-FileCopyrightText = "The Android Open Source Project"
SPDX-License-Identifier = "Apache-2.0"

# PulseAudio startup script, a copy of mer-hybris droid-hal-configs (dcd)
# sparse/etc/pulse/default_sailfish.pa (PulseAudio's default.pa adapted by
# Jolla; its in-file notice is the PulseAudio LGPL text without a named
# holder) with module-meego-mainvolume's virtual_stream=true restored and a
# comment explaining why.
[[annotations]]
path = "sparse/etc/pulse/default_sailfish.pa"
SPDX-FileCopyrightText = ["The PulseAudio Developers", "Jolla Ltd.", "Johannes Meyer zum Alten Borgloh"]
SPDX-License-Identifier = "LGPL-2.1-or-later"
